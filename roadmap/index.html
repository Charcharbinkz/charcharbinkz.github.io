<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Roadmap • GC Design System</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      color: #333;
      background-color: #fff;
      line-height: 1.5;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 30px;
    }

    ul {
      padding-left: 25px;
    }

    li {
      margin-bottom: 12px;
    }

    .status {
      font-weight: bold;
    }
  </style>
</head>


<body>

  <main>

    <h1>Roadmap</h1>

    <ul id="roadmap-data">
      <li>Loading...</li>
    </ul>

  </main>


  <script>

    // --------------------------------------------------
    // Airtable configuration
    // --------------------------------------------------

    const AIRTABLE_PAT = 'patap6Duxb9WAQDz5.fcba236c56eee9b8cab1cd9365cb4a9c1e8fef9e32124613332d73d7b019f350';

    const BASE_ID = 'appr4EMtGrhAj5vvV';

    const TABLE_ID = 'tblOnmD8hrYNTt6h7';


    // --------------------------------------------------
    // Get Status and Goal from Airtable
    // --------------------------------------------------

    async function fetchRoadmapData() {

      const url =
        `https://api.airtable.com/v0/${BASE_ID}/${TABLE_ID}`;


      try {

        const response = await fetch(url, {

          headers: {
            Authorization: `Bearer ${AIRTABLE_PAT}`
          }

        });


        if (!response.ok) {

          throw new Error(
            `Airtable request failed: ${response.status}`
          );

        }


        const data = await response.json();

        console.log('Airtable data:', data);

        return data.records;

      }


      catch (error) {

        console.error(
          'Error fetching data from Airtable:',
          error
        );

        return [];

      }

    }


    async function loadRoadmap() {

  const container =
    document.getElementById('roadmap-data');

  const records =
    await fetchRoadmapData();

  container.innerHTML = '';


  // Only use records where Quarter = Quarter 1

  const quarter1Records =
    records.filter(record => {

      return record.fields['Quarter'] === 'Quarter 1';

    });


  // Add the Quarter 1 heading

  const heading =
    document.createElement('h2');

  heading.textContent = 'Quarter 1';

  container.appendChild(heading);


  // Create the bullet list

  const list =
    document.createElement('ul');


  quarter1Records.forEach(record => {

    const fields = record.fields;

    const status =
      fields['Status'] || '';

    const goal =
      fields['Goal'] || '';


    const listItem =
      document.createElement('li');


    listItem.innerHTML = `
      <span class="status">${status}</span>
      — ${goal}
    `;


    list.appendChild(listItem);

  });


  container.appendChild(list);


  if (quarter1Records.length === 0) {

    container.innerHTML += `
      <p>No roadmap information found for Quarter 1.</p>
    `;

  }

}


    loadRoadmap();

  </script>

</body>

</html>
