<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Roadmap </title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      color: #333;
      background-color: #fff;
      line-height: 1.5;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 30px;
    }

    h2 {
      font-size: 1.5rem;
      margin-top: 35px;
      margin-bottom: 15px;
    }

    ul {
      padding-left: 25px;
    }

    li {
      margin-bottom: 12px;
    }

    .status {
      font-weight: bold;
    }
  </style>
</head>


<body>

  <main>

    <h1>Roadmap</h1>


    <!-- Quarter 1 -->

    <h2>Quarter 1</h2>

    <div id="quarter-1">
      <p>Loading...</p>
    </div>


    <!-- Quarter 2 -->

    <h2>Quarter 2</h2>

    <div id="quarter-2">
      <p>Loading...</p>
    </div>

  </main>


  <script>

    // --------------------------------------------------
    // Airtable configuration
    // --------------------------------------------------

    const AIRTABLE_PAT = 'patap6Duxb9WAQDz5.fcba236c56eee9b8cab1cd9365cb4a9c1e8fef9e32124613332d73d7b019f350';

    const BASE_ID = 'appr4EMtGrhAj5vvV';

    const TABLE_ID = 'tblOnmD8hrYNTt6h7';


    // --------------------------------------------------
    // Get roadmap data from Airtable
    // --------------------------------------------------

    async function fetchRoadmapData() {

      const url =
        `https://api.airtable.com/v0/${BASE_ID}/${TABLE_ID}`;


      try {

        const response = await fetch(url, {

          headers: {
            Authorization: `Bearer ${AIRTABLE_PAT}`
          }

        });


        if (!response.ok) {

          throw new Error(
            `Airtable request failed: ${response.status}`
          );

        }


        const data = await response.json();

        console.log('Airtable data:', data);

        return data.records;

      }


      catch (error) {

        console.error(
          'Error fetching data from Airtable:',
          error
        );

        return [];

      }

    }


    // --------------------------------------------------
    // Display roadmap
    // --------------------------------------------------

    async function loadRoadmap() {

      const records =
        await fetchRoadmapData();


      const quarter1 =
        document.getElementById('quarter-1');

      const quarter2 =
        document.getElementById('quarter-2');


      // Clear loading messages

      quarter1.innerHTML = '';

      quarter2.innerHTML = '';


      // Create lists

      const quarter1List =
        document.createElement('ul');

      const quarter2List =
        document.createElement('ul');


      // Add records to the appropriate quarter

      records.forEach(record => {

        const fields =
          record.fields;


        const quarter =
          String(fields['Quarter']);


        const status =
          fields['Status'] || '';

        const goal =
          fields['Goal'] || '';


        const listItem =
          document.createElement('li');


        listItem.innerHTML = `
          <span class="status">${status}</span>
          ${goal}
        `;


        if (quarter === '1') {

          quarter1List.appendChild(
            listItem
          );

        }


        if (quarter === '2') {

          quarter2List.appendChild(
            listItem
          );

        }

      });


      // Add lists to the page

      quarter1.appendChild(
        quarter1List
      );

      quarter2.appendChild(
        quarter2List
      );

    }


    // --------------------------------------------------
    // Run when the page loads
    // --------------------------------------------------

    loadRoadmap();

  </script>

</body>

</html>
