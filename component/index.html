<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Alert • GC Design System</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      color: #333;
      background: #fff;
      line-height: 1.5;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .intro {
      margin-bottom: 30px;
    }

    /* Accessibility status */

    .status {
      border-top: 1px solid #ddd;
      border-bottom: 1px solid #ddd;
      margin: 20px 0 30px 0;
      padding: 15px 0;
    }

    .status h2 {
      font-size: 1rem;
      margin: 0 0 8px 0;
    }

    .status p {
      margin: 5px 0;
    }

    .label {
      font-weight: bold;
    }

    /* Alert */

    .alert {
      border-left: 5px solid #26374a;
      background: #f5f5f5;
      padding: 20px;
      margin: 30px 0;
    }

    .alert h2 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 1.25rem;
    }

    .alert p {
      margin: 0;
    }
  </style>

</head>

<body>

  <main>

<h1>Alert</h1>


<!-- Airtable accessibility information -->

<section class="status">

  <div id="airtable-data">
    Loading...
  </div>

</section>

<p class="intro">
  An alert communicates important information that requires
  attention without interrupting the user's current task.
</p>


<!-- Alert component -->

<div class="alert" role="alert">

  <h2>Component preview</h2>

  <p>
    This is an example of an alert. Wow! Look at it go.
  </p>

</div>
...

  </main>

  <script>

    // Airtable connection

    const AIRTABLE_PAT = 'patap6Duxb9WAQDz5.fcba236c56eee9b8cab1cd9365cb4a9c1e8fef9e32124613332d73d7b019f350';
    const BASE_ID = 'app2Jrt1yk2MisSqo';
    const TABLE_ID = 'tbl31F7EhBfNxD3EI';


    async function fetchAirtableData() {

      const formula = "{Component Name}='Alert'";

      const url =
        `https://api.airtable.com/v0/${BASE_ID}/${TABLE_ID}` +
        `?filterByFormula=${encodeURIComponent(formula)}` +
        `&fields[]=WCAG%20Conformance%20Level` +
        `&fields[]=Version%20last%20tested`;

      try {
        const response = await fetch(url, {
          headers: {
            Authorization: `Bearer ${AIRTABLE_PAT}`
          }
        });

        const data = await response.json();

        console.log(data);

        return data.records;

      } catch (error) {
        console.error('Error fetching data from Airtable:', error);
        return [];
      }
    }

    async function loadPage() {
      const records = await fetchAirtableData();

      if (records.length > 0) {
        const fields = records[0].fields;

        document.getElementById('airtable-data').innerHTML = `
          <p>WCAG version 2.1 ${fields['WCAG Conformance Level'] || ''}</p>
          <p>Version last tested: ${fields['Version last tested'] || ''}</p>
        `;
      }
    }

    loadPage();
  </script>

</body>
</html>
