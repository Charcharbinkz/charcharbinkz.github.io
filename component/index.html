<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Components</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f9f9f9;
    }

    h1 {
      color: #333;
    }
  </style>
</head>

<body>

  <h1>Components</h1>

  <div id="components">
    Loading...
  </div>

  <script src="/js/airtable.js"></script>

  <script>
    async function fetchAirtableData() {
    const formula = "{Component Name}='Alert'";

    const url =
      `https://api.airtable.com/v0/${BASE_ID}/${TABLE_ID}` +
      `?filterByFormula=${encodeURIComponent(formula)}` +
      `&fields[]=WCAG%20Conformance%20Level` +
      `&fields[]=Version%20last%20tested`;

    try {
      const response = await fetch(url, {
        headers: {
          Authorization: `Bearer ${AIRTABLE_PAT}`
        }
      });

      const data = await response.json();
      return data.records;

    } catch (error) {
      console.error('Error fetching data from Airtable:', error);
      return [];
    }
  }

  async function loadPage() {
    const records = await fetchAirtableData();

    if (records.length > 0) {
      const fields = records[0].fields;

      document.getElementById('airtable-data').innerHTML = `
        <p>WCAG Conformance Level: ${fields['WCAG Conformance Level'] || ''}</p>
        <p>Version last tested: ${fields['Version last tested'] || ''}</p>
      `;
    }
  }


    loadPage();
  </script>

</body>
</html>
