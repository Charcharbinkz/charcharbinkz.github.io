<!DOCTYPE html>
<html lang="en">
<head> 
  <meta charset="UTF-8">
  <title>GC Design System • Accessibility Status</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f9f9f9;
    }

    h1 {
      color: #333;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background-color: #fff;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
    }

    th {
      background-color: #f1f1f1;
      font-weight: bold;
    }

    tr:nth-child(even) {
      background-color: #fafafa;
    }
  </style>
</head>

<body>

  <h1>GC Design System • Accessibility Status</h1>

<table>
  <thead>
    <tr>
      <!-- Match these to your Airtable Column Names -->
      <th>Component name</th>
      <th>WCAG Version</th>
      <th>WCAG Conformance Level</th>
    </tr>
  </thead>
  <tbody id="airtable-data">
    <!-- Airtable rows will load here dynamically -->
  </tbody>
</table>

<script>
  // Replace with your actual Personal Access Token
  const AIRTABLE_PAT = 'YOUR_PERSONAL_ACCESS_TOKEN'; 
  const BASE_ID = 'app2Jrt1yk2MisSqo';
  const TABLE_ID = 'tbl31F7EhBfNxD3EI';

  async function fetchAirtableData() {
    const url = `https://airtable.com{BASE_ID}/${TABLE_ID}`;
    
    try {
      const response = await fetch(url, {
        headers: {
          Authorization: `Bearer ${AIRTABLE_PAT}`
        }
      });
      
      const data = await response.json();
      const tableBody = document.getElementById('airtable-data');
      tableBody.innerHTML = ''; // Clear fallback content
      
      data.records.forEach(record => {
        const fields = record.fields;
        
        // Create a new row
        const row = document.createElement('tr');
        
        // Map fields to your columns (Change 'Column Name' to match Airtable exactly)
        row.innerHTML = `
          <td>${fields['Column 1'] || ''}</td>
          <td>${fields['Column 2'] || ''}</td>
          <td>${fields['Column 3'] || ''}</td>
        `;
        
        tableBody.appendChild(row);
      });
    } catch (error) {
      console.error('Error fetching data from Airtable:', error);
    }
  }

  // Run the script on page load
  fetchAirtableData();
</script>
 
</body>
</html>
